log-level: debug
pid-file: redis.pid
host: 0.0.0.0
redis-port: 6379
http-port: 6380
rpc-port: 6381
cache-size: 10485760
store:
  path: mocktikv://
  level: info
  gc-enable: false
  slow-request: 100ms
  read-timeout: 1s
  list-timeout: 1m0s
  write-timeout: 1s
  batch-put-timeout: 1m0s
  batch-delete-timeout: 1m0s
  tso-slow-threshold: 100ms
  disable-lock-back-off: false
  batch-limit: 200
gc:
  tick-interval: 2s
  ttl-workers: 2
  ttl-batch-limit: 1
lua:
  init-pool-size: 10
  max-pool-size: 100
  timeout: 1s
auth:
  root: root
  pass: root
  max-users: 1000
  max-passwords-per-user: 10
  max-db-per-user: 64
key:
  scan-max-count: 10000
  cursor-expirate-second: 600
  db-size-hash: 128
rpc:
  timeout: 10s
  max_stream: 1000
  max_msg_size: 1048576
  compress: false
pubsub:
  max-slow-message-per-subscribe: 1000
